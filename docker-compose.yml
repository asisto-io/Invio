name: invio

services:
  invio:
    # Fork deploys this repo via Dokploy; build locally instead of pulling
    # ghcr.io/kittendevv/invio so asisto-io customizations actually ship.
    build: .
    env_file:
      - .env
    volumes:
      - invio_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  invio_data:
    driver: local
